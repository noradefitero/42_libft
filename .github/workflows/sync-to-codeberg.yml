name: Sync to Codeberg

on:
  push:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Codeberg SSH host keys
        id: codeberg_known_hosts
        run: |
          {
            echo "hosts<<EOF"
            ssh-keyscan -t rsa,ecdsa,ed25519 codeberg.org 2>/dev/null
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Mirror repository
        uses: yesolutions/mirror-action@v0.7.0
        with:
          REMOTE: "git@codeberg.org:noradefitero/42_libft.git"
          GIT_SSH_PRIVATE_KEY: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
          GIT_SSH_KNOWN_HOSTS: ${{ steps.codeberg_known_hosts.outputs.hosts }}